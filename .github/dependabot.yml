# Dependabot opens one pull request per group, once a month.
# Each PR lives on its own short-lived "dependabot/..." branch, which is removed once the PR
# is merged or closed. Major versions of TypeScript and @types/node are skipped: TypeScript 7
# is a rewrite that Next.js does not support yet, and @types/node must match Node 22 used in CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
